version: '3.8'

services:
  web:
    build: .
    container_name: sudoku-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: sudoku-db
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sudoku_db
    ports:
      - "5432:5432"
